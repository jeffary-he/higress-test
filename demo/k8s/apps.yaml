apiVersion: apps/v1
kind: Deployment
metadata:
  name: gray-demo-api-stable
  namespace: gray-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: gray-demo-api, version: stable }
  template:
    metadata:
      labels: { app: gray-demo-api, version: stable }
    spec:
      containers:
      - name: api
        image: harbor-ningxia.pontosense.net/base-image/gray-demo-api:stable
        env:
        - name: DEMO_VERSION
          value: stable
        ports: [{ name: http, containerPort: 8080 }]
        readinessProbe: { httpGet: { path: /healthz, port: http } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gray-demo-api-canary
  namespace: gray-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: gray-demo-api, version: canary }
  template:
    metadata:
      labels: { app: gray-demo-api, version: canary }
    spec:
      containers:
      - name: api
        image: harbor-ningxia.pontosense.net/base-image/gray-demo-api:canary
        env:
        - name: DEMO_VERSION
          value: canary
        ports: [{ name: http, containerPort: 8080 }]
        readinessProbe: { httpGet: { path: /healthz, port: http } }
---
apiVersion: v1
kind: Service
metadata:
  name: gray-demo-api-stable
  namespace: gray-demo
spec:
  selector: { app: gray-demo-api, version: stable }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: gray-demo-api-canary
  namespace: gray-demo
spec:
  selector: { app: gray-demo-api, version: canary }
  ports: [{ name: http, port: 8080, targetPort: http }]
