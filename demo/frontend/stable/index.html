<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>正式环境 - Higress 灰度 Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #eef6ff; color: #123; }
    main { max-width: 760px; margin: 80px auto; padding: 40px; background: white; border-top: 8px solid #1677ff; border-radius: 12px; box-shadow: 0 4px 20px #0001; }
    .badge { display: inline-block; padding: 8px 14px; border-radius: 20px; background: #e6f4ff; color: #0958d9; font-weight: 700; }
    pre { background: #101828; color: #d1e9ff; padding: 16px; border-radius: 8px; overflow: auto; }
  </style>
</head>
<body>
<main>
  <span class="badge">STABLE 正式页面</span>
  <h1>正式环境首页</h1>
  <p>这是前端 stable 服务返回的独立页面。</p>
  <p>后端实际版本：</p>
  <pre id="result">请求中...</pre>
</main>
<script>
async function loadVersion() {
  const response = await fetch('/api/gray/status', { credentials: 'include' });
  if (response.headers.get('x-frontend-gray-refresh') === 'true') {
    location.reload();
    return;
  }
  document.getElementById('result').textContent = JSON.stringify(await response.json(), null, 2);
}
loadVersion().catch(error => {
  document.getElementById('result').textContent = String(error);
});
</script>
</body>
</html>
