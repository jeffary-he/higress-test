<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>灰度环境 - Higress 灰度 Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #fff7e6; color: #321; }
    main { max-width: 760px; margin: 80px auto; padding: 40px; background: white; border-top: 8px solid #fa8c16; border-radius: 12px; box-shadow: 0 4px 20px #0001; }
    .badge { display: inline-block; padding: 8px 14px; border-radius: 20px; background: #fff1b8; color: #ad4e00; font-weight: 700; }
    pre { background: #3b2412; color: #ffe7ba; padding: 16px; border-radius: 8px; overflow: auto; }
  </style>
</head>
<body>
<main>
  <span class="badge">CANARY 灰度页面</span>
  <h1>灰度环境首页</h1>
  <p>这是前端 canary 服务返回的独立页面。</p>
  <p>后端实际版本：</p>
  <pre id="result">请求中...</pre>
</main>
<script>
let loading = false;
function reloadIfNeeded(response) {
  if (response.headers.get('x-frontend-gray-refresh') !== 'true') {
    return false;
  }

  const key = 'gray-refresh-at';
  const lastRefresh = Number(sessionStorage.getItem(key) || '0');
  if (Date.now() - lastRefresh < 5000) {
    return false;
  }

  sessionStorage.setItem(key, String(Date.now()));
  const url = new URL(window.location.href);
  url.searchParams.set('_gray_refresh', String(Date.now()));
  window.location.replace(url.toString());
  return true;
}

async function loadVersion() {
  if (loading) return;
  loading = true;
  try {
  const response = await fetch('/api/gray/status', { credentials: 'include' });
  if (reloadIfNeeded(response)) {
    return;
  }
  const body = await response.text();
  try {
    document.getElementById('result').textContent = JSON.stringify(JSON.parse(body), null, 2);
  } catch (_) {
    throw new Error(`API 返回非 JSON，HTTP ${response.status}：${body.slice(0, 300)}`);
  }
  } finally {
    loading = false;
  }
}
loadVersion().catch(error => {
  document.getElementById('result').textContent = String(error);
});
setInterval(() => {
  loadVersion().catch(error => {
    document.getElementById('result').textContent = String(error);
  });
}, 10000);
</script>
</body>
</html>
