apiVersion: 1.0.0
info:
  category: custom
  name: gray-whitelist
  title: PC 灰度白名单
  description: "支持白名单和流量两种互斥模式：白名单模式解析 JWT 的 tenantId/id，流量模式对完整 Token 做 SHA-256 分组。写入 x-gray-user 请求头，沿用前端灰度 Cookie 和刷新响应头。"
  x-description-i18n:
    en-US: Determine PC gray traffic by tenantId or id in PC_AUTH_TOKEN and add the x-gray-user request header inside the gateway.
  version: 0.7.1
  contact:
    name: Engineering Team
    email: engineering@example.com
spec:
  phase: AUTHN
  priority: 100
  configSchema:
    openAPIV3Schema:
      type: object
      properties:
        gateway_include_path_prefixes:
          type: array
          title: 灰度包含路径前缀
          description: 纯字符串前缀匹配，忽略查询参数；为空时跳过全部请求。不支持通配符。
          items:
            type: string
        gateway_exclude_path_prefixes:
          type: array
          title: 灰度排除路径前缀
          description: 优先于包含规则；命中后请求与响应均不做灰度处理，保留上游原始响应。
          items:
            type: string
        redis_cluster:
          type: string
          title: Redis Cluster
          description: Envoy 中定义的 Redis 上游 Cluster 名称。
          example: outbound|6379||redis.default.svc.cluster.local
        redis_database:
          type: integer
          title: Redis 数据库
          description: Redis 数据库编号，范围 0-15。
          minimum: 0
          maximum: 15
          example: 15
        gray_enabled_key:
          type: string
          title: 灰度开关 Key
          description: Redis String Key，值为 1 开启灰度，0 关闭灰度。
          example: gray:whitelist:pc:enabled
        gray_tenant_key:
          type: string
          title: 租户白名单 Key
          description: Redis Set Key，成员为纯租户 ID。
          example: gray:whitelist:pc:tenantId
        gray_mode_key:
          type: string
          title: 灰度模式 Key
          description: Redis String，whitelist 或 traffic；Key 不存在时使用 whitelist。
          default: gray:whitelist:pc:mode
        gray_percent_key:
          type: string
          title: 流量比例 Key
          description: Redis String，0 到 100 的整数，仅 traffic 模式读取。
          default: gray:whitelist:pc:percent
        gray_user_key:
          type: string
          title: 用户 ID 白名单 Key
          description: Redis Set Key，成员为纯用户 ID。
          example: gray:whitelist:pc:userId
        redis_username:
          type: string
          title: Redis 用户名
          description: Redis ACL 用户名，未启用 ACL 时可留空。
        redis_password:
          type: string
          title: Redis 密码
          description: Redis 认证密码。
        redis_timeout_ms:
          type: integer
          title: Redis 超时时间
          description: Redis 请求超时时间，单位毫秒。
          minimum: 100
          maximum: 60000
          example: 1000
        gateway_refresh_interval_seconds:
          type: integer
          title: 刷新间隔
          description: 从 Redis 同步灰度开关和白名单的间隔，单位秒。
          minimum: 1
          maximum: 3600
          example: 10
        gateway_cache_ttl_seconds:
          type: integer
          title: 本地缓存 TTL
          description: 本地缓存最长有效时间，单位秒；超过后默认走 stable。
          minimum: 1
          maximum: 86400
          example: 60
        gray_max_entries:
          type: integer
          title: 最大白名单数量
          description: 单个白名单 Set 允许的最大成员数量。
          minimum: 1
          example: 10000
        jwt_token_cookie_name:
          type: string
          title: JWT Cookie 名称
          description: 保存 JWT 的 Cookie 字段名。
          example: PC_AUTH_TOKEN
        jwt_tenant_id_claim:
          type: string
          title: 租户 Claim
          description: JWT Payload 中的租户 ID 字段名。
          example: tenantId
        jwt_user_id_claim:
          type: string
          title: 用户 Claim
          description: JWT Payload 中的用户 ID 字段名。
          example: id
        frontend_response_header_enabled:
          type: boolean
          title: 返回灰度响应头
          description: 是否向客户端返回 x-gray-user 响应头。
          default: true
        frontend_gray_cookie_name:
          type: string
          title: 前端灰度 Cookie 名称
          description: 必须与 Higress canary-by-cookie 配置的 Cookie 名称一致。
          example: x-gray-user
        frontend_gray_cookie_domain:
          type: string
          title: 前端灰度 Cookie Domain
          description: 可选的 Cookie Domain，用于跨子域共享。
          example: .example.com
        redis_connectivity_test_enabled:
          type: boolean
          title: Redis 连通性测试
          description: 是否定时对测试 Key 执行 INCR，仅用于临时诊断。
          default: false
        redis_connectivity_test_key:
          type: string
          title: 连通性测试 Key
          description: Redis 连通性测试使用的 INCR Key。
          example: gray:whitelist:pc:connectivity-test
        redis_connectivity_test_interval_seconds:
          type: integer
          title: 连通性测试间隔
          description: 连通性测试执行间隔，单位秒。
          minimum: 1
          maximum: 3600
          example: 60
