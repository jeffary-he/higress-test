apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: gray-whitelist
  namespace: higress-system
spec:
  url: oci://YOUR_REGISTRY/gray-whitelist-wasm:0.6.1
  # 在认证阶段处理请求头，保证 x-gray-user 能参与后续路由匹配。
  phase: AUTHN
  priority: 100
  defaultConfig:
    redis_cluster: "outbound|6379||aws-redis.dns"
    redis_database: 15
    redis_key: gray:whitelist:user:v1
    redis_username: "saas"
    redis_password: "REPLACE_WITH_REDIS_PASSWORD"
    redis_timeout_ms: 1000
    refresh_interval_ms: 10000
    cache_ttl_ms: 60000
    max_entries: 10000
    token_cookie_name: PC_AUTH_TOKEN
    tenant_id_claim: tenantId
    user_id_claim: id
    # 灰度判断和请求头转换全部在网关内部完成。
    response_header_enabled: false
    # 不信任客户端传入的灰度头，每次根据 Cookie 和本地缓存重新判断。
    trust_request_header: false
    # Temporary diagnostic. Enable only while testing Redis write connectivity.
    connectivity_test_enabled: false
    connectivity_test_key: gray:whitelist:connectivity-test:v1
    connectivity_test_interval_ms: 60000
